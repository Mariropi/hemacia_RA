
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Circulação Sanguínea em Realidade Aumentada</title>

  <!-- Bibliotecas de realidade aumentada -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #dce8ef;
    }

    #titulo {
      position: fixed;
      top: 12px;
      left: 5%;
      width: 90%;
      padding: 12px;
      background: rgba(15, 40, 65, 0.9);
      color: white;
      border-radius: 12px;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }

    #titulo h1 {
      font-size: 16px;
      margin: 0;
    }

    #titulo p {
      font-size: 11px;
      margin: 5px 0 0;
    }

    #status {
      position: fixed;
      top: 95px;
      left: 5%;
      width: 90%;
      padding: 10px;
      background: rgba(18, 55, 78, 0.9);
      color: white;
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
      z-index: 101;
      pointer-events: none;
    }

    #iniciar {
      position: fixed;
      top: 145px;
      left: 50%;
      transform: translateX(-50%);
      padding: 13px 22px;
      background: #146f9c;
      color: white;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      z-index: 110;
    }

    #painel {
      position: fixed;
      bottom: 12px;
      left: 5%;
      width: 90%;
      padding: 13px;
      background: rgba(255,255,255,0.95);
      color: #25384b;
      border-radius: 12px;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }

    #painel h2 {
      margin: 0 0 7px;
      color: #b41c38;
      font-size: 16px;
    }

    #painel p {
      margin: 5px 0;
      font-size: 12px;
      line-height: 1.4;
    }

    #areaRA {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    @media (max-width: 400px) {
      #titulo h1 {
        font-size: 14px;
      }

      #painel p {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <header id="titulo">
    <h1>Circulação Sanguínea em RA</h1>
    <p>Atlas Educativo de Hematologia</p>
  </header>

  <div id="status" role="status">
    Toque no botão para iniciar a câmera.
  </div>

  <button id="iniciar" onclick="iniciarRA()">
    Iniciar Realidade Aumentada
  </button>

  <div id="areaRA"></div>

  <section id="painel">
    <h2>Fluxo de Hemácias</h2>

    <p>
      Modelo tridimensional de um vaso sanguíneo
      com hemácias em movimento.
    </p>

    <p>
      As hemácias transportam oxigênio
      por meio da hemoglobina.
    </p>

    <p>
      Aponte a câmera para o marcador Hiro.
    </p>
  </section>

  <script>
    const statusEl = document.getElementById("status");

    function mensagem(texto) {
      statusEl.textContent = texto;
    }

    // Registra o modelo quando o A-Frame estiver disponível.
    if (window.AFRAME) {

      AFRAME.registerComponent("vaso-sanguineo", {

        init: function () {
          const THREE = AFRAME.THREE;

          this.grupo = new THREE.Group();
          this.hemacias = [];
          this.geometrias = [];
          this.materiais = [];

          this.el.setObject3D("mesh", this.grupo);

          // Vaso sanguíneo transparente.
          const matVaso = new THREE.MeshPhongMaterial({
            color: 0xc94c62,
            transparent: true,
            opacity: 0.28,
            side: THREE.DoubleSide,
            depthWrite: false,
            shininess: 80
          });

          this.materiais.push(matVaso);

          const geoVaso = new THREE.CylinderGeometry(
            0.24,
            0.24,
            1.25,
            48,
            1,
            true
          );

          geoVaso.rotateZ(Math.PI / 2);

          this.geometrias.push(geoVaso);

          const vaso = new THREE.Mesh(
            geoVaso,
            matVaso
          );

          this.grupo.add(vaso);

          // Bordas do vaso.
          const matBorda = new THREE.MeshPhongMaterial({
            color: 0xe88a99,
            shininess: 90
          });

          this.materiais.push(matBorda);

          [-0.625, 0.625].forEach(x => {
            const geoAnel = new THREE.TorusGeometry(
              0.24,
              0.012,
              8,
              48
            );

            this.geometrias.push(geoAnel);

            const anel = new THREE.Mesh(
              geoAnel,
              matBorda
            );

            anel.rotation.y = Math.PI / 2;
            anel.position.x = x;

            this.grupo.add(anel);
          });

          // Perfil bicôncavo das hemácias.
          const perfil = [
            [0.000,  0.012],
            [0.020,  0.014],
            [0.042,  0.025],
            [0.063,  0.041],
            [0.078,  0.039],
            [0.085,  0.015],
            [0.085, -0.015],
            [0.078, -0.039],
            [0.063, -0.041],
            [0.042, -0.025],
            [0.020, -0.014],
            [0.000, -0.012]
          ].map(p => new THREE.Vector2(p[0], p[1]));

          const geoHemacia = new THREE.LatheGeometry(
            perfil,
            36
          );

          this.geometrias.push(geoHemacia);

          const matHemacia = new THREE.MeshPhongMaterial({
            color: 0xc71935,
            shininess: 75,
            side: THREE.DoubleSide
          });

          this.materiais.push(matHemacia);

          // Criar 12 hemácias.
          const quantidade = 12;

          for (let i = 0; i < quantidade; i++) {

            const celula = new THREE.Mesh(
              geoHemacia,
              matHemacia
            );

            const fase = i / quantidade;

            celula.position.set(
              -0.55 + fase * 1.10,
              Math.sin(i * 2.1) * 0.07,
              Math.cos(i * 1.7) * 0.07
            );

            celula.rotation.set(
              0.5 + i * 0.15,
              i * 0.35,
              i * 0.2
            );

            this.grupo.add(celula);

            this.hemacias.push({
              objeto: celula,
              fase: fase,
              indice: i,
              velocidade: 0.14 + (i % 4) * 0.025
            });
          }
        },

        // Animação do fluxo sanguíneo.
        tick: function (tempo, delta) {

          const dt = Math.min(delta || 0, 80) / 1000;

          this.hemacias.forEach(h => {

            h.fase =
              (h.fase + h.velocidade * dt) % 1;

            h.objeto.position.x =
              -0.55 + h.fase * 1.10;

            h.objeto.position.y =
              Math.sin(h.indice * 2.1 + h.fase * 5)
              * 0.07;

            h.objeto.position.z =
              Math.cos(h.indice * 1.7 + h.fase * 4)
              * 0.07;

            h.objeto.rotation.z += dt * 0.35;
          });
        },

        remove: function () {
          this.geometrias.forEach(g => g.dispose());
          this.materiais.forEach(m => m.dispose());
          this.el.removeObject3D("mesh");
        }
      });
    }

    let iniciou = false;

    function iniciarRA() {

      if (iniciou) return;

      if (!window.AFRAME) {
        mensagem(
          "Erro: A-Frame não carregou. " +
          "Verifique a conexão e recarregue."
        );
        return;
      }

      if (!window.isSecureContext) {
        mensagem(
          "Abra o aplicativo usando HTTPS."
        );
        return;
      }

      iniciou = true;

      mensagem("Iniciando câmera...");

      document.getElementById("iniciar").style.display =
        "none";

      const area = document.getElementById("areaRA");

      // Cria a cena AR apenas depois do clique.
      area.innerHTML = `
        <a-scene
          embedded
          vr-mode-ui="enabled: false"
          renderer="antialias: true; alpha: true"
          arjs="sourceType: webcam; debugUIEnabled: false;">

          <a-entity
            light="type: ambient; intensity: 1.3">
          </a-entity>

          <a-entity
            light="type: directional; intensity: 1"
            position="1 3 2">
          </a-entity>

          <a-marker
            id="marcador"
            preset="hiro"
            emitevents="true">

            <a-entity
              vaso-sanguineo
              position="0 0.18 0"
              rotation="0 -20 0"
              scale="0.35 0.35 0.35">
            </a-entity>

          </a-marker>

          <a-entity camera></a-entity>

        </a-scene>
      `;

      const marcador =
        document.getElementById("marcador");

      marcador.addEventListener("markerFound", () => {
        mensagem(
          "Marcador detectado! Observe as hemácias."
        );
      });

      marcador.addEventListener("markerLost", () => {
        mensagem(
          "Aponte a câmera para o marcador Hiro."
        );
      });

      setTimeout(() => {

        const videos =
          Array.from(document.querySelectorAll("video"));

        const cameraAtiva = videos.some(v =>
          v.readyState >= 2 &&
          v.videoWidth > 0
        );

        if (!cameraAtiva) {
          mensagem(
            "A câmera da RA não iniciou. " +
            "Confira as permissões e o carregamento " +
            "das bibliotecas."
          );
        } else if (!marcador.object3D.visible) {
          mensagem(
            "Câmera ativa. Aponte para o marcador Hiro."
          );
        }

      }, 12000);
    }

    // Exibe erros de carregamento de scripts.
    window.addEventListener("error", function(e) {

      if (e.target &&
          e.target.tagName === "SCRIPT") {

        mensagem(
          "Falha ao carregar uma biblioteca externa."
        );
      }

    }, true);

  </script>

</body>
</html>
