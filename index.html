
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Circulação Sanguínea em Realidade Aumentada</title>

  <!-- Bibliotecas oficiais -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #titulo {
      position: fixed;
      top: 12px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      background: rgba(14, 39, 65, 0.88);
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      z-index: 100;
      pointer-events: none;
    }

    #titulo h1 {
      margin: 0;
      font-size: 16px;
    }

    #titulo p {
      margin: 5px 0 0;
      font-size: 11px;
    }

    #status {
      position: fixed;
      top: 92px;
      left: 10%;
      width: 80%;
      box-sizing: border-box;
      background: rgba(20, 45, 65, 0.88);
      color: white;
      text-align: center;
      padding: 9px;
      border-radius: 9px;
      font-size: 12px;
      z-index: 101;
      pointer-events: none;
    }

    #informacoes {
      position: fixed;
      bottom: 12px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 12px;
      background: rgba(255, 255, 255, 0.94);
      color: #24394b;
      border-radius: 12px;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }

    #informacoes h2 {
      margin: 0 0 6px;
      color: #b21c39;
      font-size: 15px;
    }

    #informacoes p {
      margin: 4px 0;
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 400px) {
      #titulo h1 {
        font-size: 14px;
      }

      #informacoes p {
        font-size: 11px;
      }
    }
  </style>

  <script>
    // Componente que cria o vaso e as hemácias.
    AFRAME.registerComponent('fluxo-sanguineo', {

      init: function () {

        const THREE = AFRAME.THREE;

        this.grupo = new THREE.Group();
        this.celulas = [];

        this.el.setObject3D('mesh', this.grupo);

        // Materiais do vaso
        const materialVaso = new THREE.MeshPhongMaterial({
          color: 0xc94d60,
          transparent: true,
          opacity: 0.28,
          side: THREE.DoubleSide,
          depthWrite: false,
          shininess: 85
        });

        // Vaso orientado horizontalmente
        const geometriaVaso = new THREE.CylinderGeometry(
          0.24,
          0.24,
          1.25,
          48,
          1,
          true
        );

        geometriaVaso.rotateZ(Math.PI / 2);

        const vaso = new THREE.Mesh(
          geometriaVaso,
          materialVaso
        );

        this.grupo.add(vaso);

        // Bordas para dar espessura visual ao vaso.
        const materialBorda = new THREE.MeshPhongMaterial({
          color: 0xe78391,
          shininess: 90
        });

        [-0.625, 0.625].forEach(x => {

          const geometriaAnel = new THREE.TorusGeometry(
            0.24,
            0.012,
            10,
            48
          );

          const anel = new THREE.Mesh(
            geometriaAnel,
            materialBorda
          );

          anel.rotation.y = Math.PI / 2;
          anel.position.x = x;

          this.grupo.add(anel);
        });

        // Geometria bicôncava da hemácia.
        const pontos = [
          [0.000, 0.012],
          [0.020, 0.014],
          [0.042, 0.024],
          [0.063, 0.042],
          [0.075, 0.043],
          [0.083, 0.027],
          [0.085, 0.000],
          [0.083, -0.027],
          [0.075, -0.043],
          [0.063, -0.042],
          [0.042, -0.024],
          [0.020, -0.014],
          [0.000, -0.012]
        ];

        const perfil = pontos.map(p =>
          new THREE.Vector2(p[0], p[1])
        );

        const geometriaHemacia = new THREE.LatheGeometry(
          perfil,
          40
        );

        const materialHemacia = new THREE.MeshPhongMaterial({
          color: 0xce1835,
          shininess: 65,
          side: THREE.DoubleSide
        });

        // Criar várias hemácias.
        const quantidade = 12;

        for (let i = 0; i < quantidade; i++) {

          const celula = new THREE.Mesh(
            geometriaHemacia,
            materialHemacia
          );

          const fase = i / quantidade;

          celula.position.set(
            -0.55 + fase * 1.10,
            Math.sin(i * 2.1) * 0.07,
            Math.cos(i * 1.7) * 0.07
          );

          celula.rotation.set(
            0.5 + i * 0.15,
            i * 0.4,
            i * 0.2
          );

          this.grupo.add(celula);

          this.celulas.push({
            objeto: celula,
            fase: fase,
            indice: i,
            velocidade: 0.14 + (i % 4) * 0.025
          });
        }

        this.geometrias = [
          geometriaVaso,
          geometriaHemacia
        ];

        this.materiais = [
          materialVaso,
          materialBorda,
          materialHemacia
        ];
      },

      // Movimento contínuo das hemácias.
      tick: function (tempo, delta) {

        if (!this.celulas) return;

        const dt = Math.min(delta || 0, 80) / 1000;

        this.celulas.forEach(c => {

          c.fase =
            (c.fase + c.velocidade * dt) % 1;

          c.objeto.position.x =
            -0.55 + c.fase * 1.10;

          c.objeto.position.y =
            Math.sin(c.indice * 2.1 + c.fase * 5)
            * 0.07;

          c.objeto.position.z =
            Math.cos(c.indice * 1.7 + c.fase * 4)
            * 0.07;

          c.objeto.rotation.z += dt * 0.35;
        });
      },

      remove: function () {

        if (!this.grupo) return;

        this.grupo.traverse(obj => {
          if (obj.isMesh && obj.geometry) {
            // Geometrias compartilhadas são
            // descartadas abaixo.
          }
        });

        // Descartar também as geometrias dos anéis.
        this.grupo.children.forEach(obj => {
          if (obj.isMesh &&
              obj.geometry.type === 'TorusGeometry') {
            obj.geometry.dispose();
          }
        });

        this.geometrias.forEach(g => g.dispose());
        this.materiais.forEach(m => m.dispose());

        this.el.removeObject3D('mesh');
      }
    });
  </script>
</head>

<body>

  <!-- Cabeçalho -->
  <div id="titulo">
    <h1>Circulação Sanguínea em RA</h1>
    <p>Atlas Educativo de Hematologia</p>
  </div>

  <!-- Status da câmera e do marcador -->
  <div id="status" role="status">
    Iniciando câmera...
  </div>

  <!-- Painel educativo -->
  <div id="informacoes">

    <h2>Fluxo de Hemácias</h2>

    <p>
      Visualização tridimensional de um
      vaso sanguíneo com hemácias em movimento.
    </p>

    <p>
      As hemácias transportam oxigênio
      através da hemoglobina.
    </p>

    <p>
      <strong>
        Aponte a câmera para o marcador Hiro.
      </strong>
    </p>

  </div>

  <!-- Cena AR.js padrão -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Iluminação -->
    <a-entity
      light="type: ambient; intensity: 1.4">
    </a-entity>

    <a-entity
      light="type: directional; intensity: 1.1"
      position="1 3 2">
    </a-entity>

    <!-- Marcador Hiro -->
    <a-marker
      id="marcador"
      preset="hiro"
      emitevents="true">

      <!-- Vaso pequeno e centralizado -->
      <a-entity
        fluxo-sanguineo
        position="0 0.22 0"
        rotation="0 -20 0"
        scale="0.35 0.35 0.35">
      </a-entity>

    </a-marker>

    <!-- Câmera AR -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const status = document.getElementById('status');
    const marcador = document.getElementById('marcador');

    marcador.addEventListener('markerFound', () => {
      status.textContent =
        'Marcador detectado! Hemácias em movimento.';
    });

    marcador.addEventListener('markerLost', () => {
      status.textContent =
        'Aponte a câmera para o marcador Hiro.';
    });

    // Verificação básica da câmera.
    window.addEventListener('load', () => {

      if (!window.isSecureContext) {
        status.textContent =
          'Abra o aplicativo pelo endereço HTTPS.';
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        status.textContent =
          'Este navegador não oferece acesso à câmera.';
        return;
      }

      setTimeout(() => {
        const video = document.querySelector('video');

        if (!video || video.readyState < 2) {
          status.textContent =
            'Câmera não iniciada. Confira a permissão e recarregue.';
        } else {
          if (!marcador.object3D.visible) {
            status.textContent =
              'Câmera ativa. Aponte para o marcador Hiro.';
          }
        }
      }, 12000);
    });
  </script>

</body>
</html>
