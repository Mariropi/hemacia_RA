
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Circulação Sanguínea 3D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #081a2b;
  font-family: Arial, sans-serif;
}

#cena {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#cabecalho {
  position: fixed;
  top: max(8px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  width: min(94%, 550px);
  padding: 10px;
  border-radius: 12px;
  background: rgba(10, 36, 57, 0.88);
  color: white;
  text-align: center;
  pointer-events: none;
}

h1 {
  margin: 0;
  font-size: clamp(14px, 3.5vw, 20px);
}

#cabecalho p {
  margin: 5px 0 0;
  font-size: 11px;
}

#rodape {
  position: fixed;
  bottom: max(8px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: min(94%, 550px);
  padding: 10px;
  background: rgba(255, 255, 255, 0.94);
  border-radius: 12px;
  text-align: center;
  pointer-events: none;
}

#rodape h2 {
  margin: 0 0 5px;
  color: #a91c39;
  font-size: 15px;
}

#rodape p {
  margin: 4px 0;
  font-size: 11px;
  color: #29394a;
}

#aviso {
  position: fixed;
  top: 85px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 450px);
  color: #ffffff;
  text-align: center;
  font-size: 12px;
  pointer-events: none;
}

@media (orientation: landscape) {
  #cabecalho {
    top: 4px;
    padding: 5px;
  }

  #cabecalho p {
    display: none;
  }

  #rodape {
    bottom: 4px;
    padding: 5px;
  }

  #rodape p:last-child {
    display: none;
  }

  #aviso {
    top: 45px;
  }
}
</style>
</head>

<body>

<canvas id="cena"></canvas>

<header id="cabecalho">
  <h1>Circulação Sanguínea 3D</h1>
  <p>Modelo Educativo de Hematologia</p>
</header>

<div id="aviso">Carregando modelo tridimensional...</div>

<section id="rodape">
  <h2>Fluxo de Hemácias</h2>
  <p>Hemácias em movimento dentro de um vaso sanguíneo.</p>
  <p>Arraste o dedo para girar o modelo.</p>
</section>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const aviso = document.getElementById("aviso");
const canvas = document.getElementById("cena");

try {
  const cena = new THREE.Scene();
  cena.background = new THREE.Color(0x081a2b);

  const camera = new THREE.PerspectiveCamera(
    45, 1, 0.1, 100
  );

  camera.position.set(0, 0.3, 3.6);

  const render = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false
  });

  render.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  const luzAmbiente = new THREE.AmbientLight(
    0xffffff, 1.7
  );
  cena.add(luzAmbiente);

  const luzDirecional = new THREE.DirectionalLight(
    0xffffff, 2
  );
  luzDirecional.position.set(2, 3, 5);
  cena.add(luzDirecional);

  const grupo = new THREE.Group();
  cena.add(grupo);

  // Vaso sanguíneo transparente
  const materialVaso = new THREE.MeshPhongMaterial({
    color: 0xc94660,
    transparent: true,
    opacity: 0.25,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  const geometriaVaso = new THREE.CylinderGeometry(
    0.42, 0.42, 2.3, 64, 1, true
  );

  geometriaVaso.rotateZ(Math.PI / 2);

  const vaso = new THREE.Mesh(
    geometriaVaso, materialVaso
  );

  grupo.add(vaso);

  // Anéis das extremidades
  const materialBorda = new THREE.MeshPhongMaterial({
    color: 0xe9879b,
    shininess: 85
  });

  [-1.15, 1.15].forEach(x => {
    const anel = new THREE.Mesh(
      new THREE.TorusGeometry(0.42, 0.022, 12, 64),
      materialBorda
    );

    anel.rotation.y = Math.PI / 2;
    anel.position.x = x;

    grupo.add(anel);
  });

  // Formato bicôncavo das hemácias
  const pontos = [
    [0.00, 0.025],
    [0.04, 0.028],
    [0.09, 0.05],
    [0.13, 0.075],
    [0.17, 0.065],
    [0.19, 0.02],
    [0.19, -0.02],
    [0.17, -0.065],
    [0.13, -0.075],
    [0.09, -0.05],
    [0.04, -0.028],
    [0.00, -0.025]
  ].map(p => new THREE.Vector2(p[0], p[1]));

  const geometriaHemacia = new THREE.LatheGeometry(
    pontos, 48
  );

  const materialHemacia = new THREE.MeshPhongMaterial({
    color: 0xd31d3c,
    shininess: 80,
    side: THREE.DoubleSide
  });

  const hemacias = [];

  for (let i = 0; i < 12; i++) {
    const celula = new THREE.Mesh(
      geometriaHemacia,
      materialHemacia
    );

    const fase = i / 12;

    celula.position.set(
      -1 + fase * 2,
      Math.sin(i * 2.3) * 0.14,
      Math.cos(i * 1.8) * 0.14
    );

    celula.rotation.set(
      0.5 + i * 0.2,
      i * 0.4,
      i * 0.3
    );

    grupo.add(celula);

    hemacias.push({
      objeto: celula,
      fase,
      indice: i,
      velocidade: 0.09 + (i % 4) * 0.025
    });
  }

  let arrastando = false;
  let anteriorX = 0;
  let anteriorY = 0;

  canvas.addEventListener("pointerdown", e => {
    arrastando = true;
    anteriorX = e.clientX;
    anteriorY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointerup", () => {
    arrastando = false;
  });

  canvas.addEventListener("pointermove", e => {
    if (!arrastando) return;

    grupo.rotation.y +=
      (e.clientX - anteriorX) * 0.008;

    grupo.rotation.x +=
      (e.clientY - anteriorY) * 0.008;

    anteriorX = e.clientX;
    anteriorY = e.clientY;
  });

  function ajustarTela() {
    const largura = window.innerWidth;
    const altura = window.innerHeight;

    camera.aspect = largura / altura;

    // Afasta o modelo em telas verticais.
    const distancia =
      largura < altura ? 4.5 : 3.7;

    camera.position.z = distancia;
    camera.updateProjectionMatrix();

    render.setSize(largura, altura, false);
  }

  window.addEventListener("resize", ajustarTela);
  ajustarTela();

  const relogio = new THREE.Clock();

  function animar() {
    requestAnimationFrame(animar);

    const dt = Math.min(relogio.getDelta(), 0.05);

    hemacias.forEach(h => {
      h.fase =
        (h.fase + h.velocidade * dt) % 1;

      h.objeto.position.x =
        -1 + h.fase * 2;

      h.objeto.position.y =
        Math.sin(h.indice * 2.3 + h.fase * 5)
        * 0.14;

      h.objeto.position.z =
        Math.cos(h.indice * 1.8 + h.fase * 4)
        * 0.14;

      h.objeto.rotation.z += dt * 0.35;
    });

    grupo.rotation.y += dt * 0.08;

    render.render(cena, camera);
  }

  aviso.textContent =
    "Modelo 3D interativo • Arraste para girar";

  animar();

} catch (erro) {
  aviso.textContent =
    "Erro ao iniciar o modelo 3D: " + erro.message;
  console.error(erro);
}
</script>

</body>
</html>
