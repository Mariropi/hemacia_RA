
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Hemácia 3D - Realidade Aumentada</title>

  <!-- Bibliotecas de realidade aumentada -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #cabecalho {
      position: fixed;
      top: 10px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 12px;
      background: rgba(12, 37, 65, 0.90);
      color: white;
      text-align: center;
      border-radius: 12px;
      z-index: 10;
    }

    #cabecalho h2 {
      margin: 0;
      font-size: 18px;
    }

    #cabecalho p {
      margin: 6px 0 0;
      font-size: 12px;
    }

    #informacoes {
      position: fixed;
      bottom: 20px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 14px;
      background: rgba(255, 255, 255, 0.94);
      color: #17324d;
      border-radius: 12px;
      z-index: 10;
      text-align: center;
    }

    #informacoes h3 {
      margin: 0 0 7px;
      color: #b71c1c;
    }

    #informacoes p {
      margin: 5px 0;
      font-size: 13px;
    }
  </style>

  <script>
    // Criação da geometria de uma hemácia bicôncava.
    AFRAME.registerComponent('hemacia-3d', {
      init: function () {
        const THREE = AFRAME.THREE;

        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const indices = [];

        const segmentos = 64;
        const aneis = 24;
        const raio = 0.55;

        // Superfícies superior e inferior.
        for (let lado = 0; lado < 2; lado++) {
          const sinal = lado === 0 ? 1 : -1;

          for (let i = 0; i <= aneis; i++) {
            const r = raio * i / aneis;
            const t = r / raio;

            // Depressão central e bordas espessas.
            const altura =
              0.07 + 0.23 * Math.pow(
                Math.sin(Math.PI * t), 2
              );

            for (let j = 0; j <= segmentos; j++) {
              const angulo =
                2 * Math.PI * j / segmentos;

              vertices.push(
                r * Math.cos(angulo),
                sinal * altura,
                r * Math.sin(angulo)
              );
            }
          }
        }

        const porSuperficie =
          (aneis + 1) * (segmentos + 1);

        for (let lado = 0; lado < 2; lado++) {
          const inicio = lado * porSuperficie;

          for (let i = 0; i < aneis; i++) {
            for (let j = 0; j < segmentos; j++) {
              const a =
                inicio + i * (segmentos + 1) + j;
              const b = a + segmentos + 1;

              if (lado === 0) {
                indices.push(a, a + 1, b);
                indices.push(a + 1, b + 1, b);
              } else {
                indices.push(a, b, a + 1);
                indices.push(a + 1, b, b + 1);
              }
            }
          }
        }

        // Une as bordas das duas superfícies.
        const borda = aneis * (segmentos + 1);

        for (let j = 0; j < segmentos; j++) {
          const a = borda + j;
          const b = borda + j + 1;
          const c = porSuperficie + borda + j;
          const d = porSuperficie + borda + j + 1;

          indices.push(a, c, b);
          indices.push(b, c, d);
        }

        geometry.setAttribute(
          'position',
          new THREE.Float32BufferAttribute(vertices, 3)
        );

        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({
          color: '#cb182e',
          roughness: 0.48,
          metalness: 0.05,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geometry, material);
        this.el.setObject3D('mesh', mesh);
      },

      remove: function () {
        const mesh = this.el.getObject3D('mesh');

        if (mesh) {
          mesh.geometry.dispose();
          mesh.material.dispose();
          this.el.removeObject3D('mesh');
        }
      }
    });
  </script>
</head>

<body>

  <!-- Título do aplicativo -->
  <div id="cabecalho">
    <h2>Hemácia em Realidade Aumentada</h2>
    <p>Atlas Educativo de Células Sanguíneas</p>
  </div>

  <!-- Informações educativas -->
  <div id="informacoes">
    <h3>Hemácia (Eritrócito)</h3>
    <p>
      Célula sanguínea responsável principalmente
      pelo transporte de oxigênio.
    </p>
    <p>
      Sua forma bicôncava favorece as trocas gasosas
      e a flexibilidade nos capilares.
    </p>
    <p>
      <strong>
        Aponte a câmera para o marcador Hiro.
      </strong>
    </p>
  </div>

  <!-- Cena de realidade aumentada -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Iluminação -->
    <a-entity
      light="type: ambient; intensity: 1.2">
    </a-entity>

    <a-entity
      light="type: directional; intensity: 1"
      position="1 3 2">
    </a-entity>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro">

      <!-- Hemácia tridimensional -->
      <a-entity
        position="0 0.5 0"
        rotation="25 0 15"
        hemacia-3d
        animation="property: rotation;
                   from: 25 0 15;
                   to: 25 360 15;
                   dur: 8000;
                   easing: linear;
                   loop: true;">
      </a-entity>

      <!-- Nome sobre o modelo -->
      <a-text
        value="HEMACIA 3D"
        position="0 1.2 0"
        rotation="-90 0 0"
        align="center"
        color="#FFFFFF"
        width="3">
      </a-text>

    </a-marker>

    <!-- Câmera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
