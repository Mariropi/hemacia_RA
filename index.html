
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Circulação Sanguínea 3D - Realidade Aumentada</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #071625;
  font-family: Arial, sans-serif;
}

#visualizacao {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#visualizacao a-scene {
  width: 100%;
  height: 100%;
}

#cabecalho {
  position: fixed;
  top: max(8px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  width: min(94%, 580px);
  z-index: 100;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(7, 25, 45, 0.88);
  color: white;
  text-align: center;
  pointer-events: none;
}

#cabecalho h1 {
  margin: 0;
  font-size: clamp(13px, 3vw, 19px);
}

#cabecalho p {
  margin: 5px 0 0;
  font-size: 11px;
  color: #c9e1ef;
}

#rodape {
  position: fixed;
  bottom: max(8px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: min(94%, 580px);
  z-index: 100;
  padding: 10px 13px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.94);
  color: #263849;
  text-align: center;
  pointer-events: none;
}

#rodape h2 {
  color: #a51d39;
  font-size: 14px;
  margin: 0 0 5px;
}

#rodape p {
  font-size: 11px;
  margin: 4px 0;
  line-height: 1.35;
}

#estado {
  position: fixed;
  top: 74px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 450px);
  z-index: 101;
  background: rgba(13, 43, 65, 0.88);
  color: white;
  text-align: center;
  font-size: 11px;
  padding: 8px;
  border-radius: 9px;
  pointer-events: none;
}

@media (orientation: landscape) {
  #cabecalho {
    top: 4px;
    width: min(65%, 530px);
    padding: 5px 10px;
  }

  #cabecalho h1 {
    font-size: 13px;
  }

  #cabecalho p {
    display: none;
  }

  #estado {
    top: 40px;
    padding: 5px;
  }

  #rodape {
    bottom: 4px;
    width: min(75%, 620px);
    padding: 5px 10px;
  }

  #rodape h2 {
    font-size: 12px;
    margin-bottom: 2px;
  }

  #rodape p {
    font-size: 10px;
    margin: 2px 0;
  }
}

@media (max-height: 360px) {
  #rodape p:last-child {
    display: none;
  }
}
</style>

<script>
// Modelo educativo de vaso sanguíneo
AFRAME.registerComponent("modelo-sangue", {

  init: function() {
    const THREE = AFRAME.THREE;

    this.grupo = new THREE.Group();
    this.celulas = [];
    this.geometrias = [];
    this.materiais = [];

    this.el.setObject3D("mesh", this.grupo);

    const matVaso = new THREE.MeshPhongMaterial({
      color: 0xc84d63,
      transparent: true,
      opacity: 0.30,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    this.materiais.push(matVaso);

    // Cilindro do vaso
    const geoVaso = new THREE.CylinderGeometry(
      0.24, 0.24, 1.3, 48, 1, true
    );

    geoVaso.rotateZ(Math.PI / 2);
    this.geometrias.push(geoVaso);

    this.grupo.add(
      new THREE.Mesh(geoVaso, matVaso)
    );

    // Anéis nas extremidades
    const matBorda = new THREE.MeshPhongMaterial({
      color: 0xe9899a,
      shininess: 85
    });

    this.materiais.push(matBorda);

    [-0.65, 0.65].forEach(x => {
      const geoAnel = new THREE.TorusGeometry(
        0.24, 0.013, 8, 48
      );

      this.geometrias.push(geoAnel);

      const anel = new THREE.Mesh(
        geoAnel, matBorda
      );

      anel.position.x = x;
      anel.rotation.y = Math.PI / 2;

      this.grupo.add(anel);
    });

    // Hemácias bicôncavas
    const perfil = [
      [0.000,  0.012],
      [0.020,  0.014],
      [0.045,  0.027],
      [0.067,  0.042],
      [0.080,  0.035],
      [0.085,  0.010],
      [0.085, -0.010],
      [0.080, -0.035],
      [0.067, -0.042],
      [0.045, -0.027],
      [0.020, -0.014],
      [0.000, -0.012]
    ].map(p => new THREE.Vector2(p[0], p[1]));

    const geoHemacia = new THREE.LatheGeometry(
      perfil, 36
    );

    this.geometrias.push(geoHemacia);

    const matHemacia = new THREE.MeshPhongMaterial({
      color: 0xd31939,
      shininess: 75,
      side: THREE.DoubleSide
    });

    this.materiais.push(matHemacia);

    for (let i = 0; i < 14; i++) {
      const celula = new THREE.Mesh(
        geoHemacia, matHemacia
      );

      const fase = i / 14;

      celula.position.set(
        -0.57 + fase * 1.14,
        Math.sin(i * 2.1) * 0.075,
        Math.cos(i * 1.7) * 0.075
      );

      celula.rotation.set(
        0.4 + i * 0.13,
        i * 0.35,
        i * 0.25
      );

      this.grupo.add(celula);

      this.celulas.push({
        objeto: celula,
        fase: fase,
        indice: i,
        velocidade: 0.13 + (i % 4) * 0.025
      });
    }
  },

  tick: function(tempo, delta) {
    const dt = Math.min(delta || 0, 80) / 1000;

    this.celulas.forEach(c => {
      c.fase = (c.fase + c.velocidade * dt) % 1;

      c.objeto.position.x =
        -0.57 + c.fase * 1.14;

      c.objeto.position.y =
        Math.sin(c.indice * 2.1 + c.fase * 5) * 0.075;

      c.objeto.position.z =
        Math.cos(c.indice * 1.7 + c.fase * 4) * 0.075;

      c.objeto.rotation.z += dt * 0.3;
    });
  },

  remove: function() {
    this.geometrias.forEach(g => g.dispose());
    this.materiais.forEach(m => m.dispose());
    this.el.removeObject3D("mesh");
  }
});
</script>
</head>

<body>

<div id="visualizacao">
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-entity
      light="type: ambient; intensity: 1.4">
    </a-entity>

    <a-entity
      light="type: directional; intensity: 1"
      position="1 3 2">
    </a-entity>

    <!-- Modelo em realidade aumentada -->
    <a-marker
      id="hiro"
      preset="hiro"
      emitevents="true">

      <a-entity
        modelo-sangue
        position="0 0.18 0"
        rotation="0 -20 0"
        scale="0.55 0.55 0.55">
      </a-entity>

    </a-marker>

    <!-- Câmera -->
    <a-entity camera></a-entity>

  </a-scene>
</div>

<header id="cabecalho">
  <h1>Circulação Sanguínea em Realidade Aumentada</h1>
  <p>Atlas Educativo • Hematologia 3D</p>
</header>

<div id="estado">
  Iniciando realidade aumentada...
</div>

<section id="rodape">
  <h2>Fluxo de Hemácias</h2>

  <p>
    Vaso sanguíneo 3D com hemácias em movimento.
  </p>

  <p>
    As hemácias transportam oxigênio
    através da hemoglobina.
  </p>

  <p>
    Aponte a câmera para o marcador Hiro.
  </p>
</section>

<script>
const estado = document.getElementById("estado");
const marcador = document.getElementById("hiro");

marcador.addEventListener("markerFound", () => {
  estado.textContent =
    "Marcador detectado! Observe o fluxo sanguíneo.";
});

marcador.addEventListener("markerLost", () => {
  estado.textContent =
    "Aponte para o marcador Hiro.";
});

// Verifica se a câmera está produzindo vídeo.
setTimeout(() => {
  const videos = [...document.querySelectorAll("video")];

  const ativa = videos.some(v =>
    v.readyState >= 2 && v.videoWidth > 0
  );

  if (!ativa) {
    estado.textContent =
      "Não foi possível iniciar a câmera de RA. " +
      "Verifique a permissão e o navegador.";
  } else if (!marcador.object3D.visible) {
    estado.textContent =
      "Câmera ativa. Aponte para o marcador Hiro.";
  }
}, 12000);

// Ajusta a cena ao girar o celular.
window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    window.dispatchEvent(new Event("resize"));
  }, 400);
});
</script>

</body>
</html>
